<div id="ch-tab-regex">
    <div class="st-chatu8-settings-section">
        <h3>Regex settings</h3>
        <div class="st-chatu8-field">
            <label for="ch-regex-profile-select">Regex configuration</label>
            <div class="st-chatu8-profile-controls">
                <select id="ch-regex-profile-select" class="st-chatu8-select"></select>
                <div class="st-chatu8-preset-box-wrapper">
                    <button type="button" class="st-chatu8-icon-btn st-chatu8-preset-box-btn" title="Preset action options">
                        <i class="fa-solid fa-cube"></i>
                    </button>
                    <div class="st-chatu8-preset-box-dropdown">
                        <div class="st-chatu8-preset-box-title">Regex configuration options</div>
                        <div class="st-chatu8-preset-box-grid">
                            <button type="button" class="st-chatu8-preset-box-item" id="ch-new-regex-profile-button" title="New"><i class="fa-solid fa-plus"></i><span>New</span></button>
                            <button type="button" class="st-chatu8-preset-box-item" id="ch-rename-regex-profile-button" title="Rename"><i class="fa-solid fa-pen"></i><span>Rename</span></button>
                            <button type="button" class="st-chatu8-preset-box-item" id="ch-save-regex-profile-button" title="Save"><i class="fa-solid fa-save"></i><span>Save</span></button>
                            <button type="button" class="st-chatu8-preset-box-item" id="ch-save-as-regex-profile-button" title="Save as"><i class="fa-solid fa-floppy-disk"></i><span>Save as</span></button>
                            <button type="button" class="st-chatu8-preset-box-item" id="ch-import-regex-profile-button" title="Import"><i class="fa-solid fa-file-import"></i><span>Import</span></button>
                            <button type="button" class="st-chatu8-preset-box-item" id="ch-export-regex-profile-button" title="Export"><i class="fa-solid fa-file-export"></i><span>Export</span></button>
                            <button type="button" class="st-chatu8-preset-box-item danger" id="ch-delete-regex-profile-button" title="Delete"><i class="fa-solid fa-trash"></i><span>Delete</span></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="st-chatu8-field-col">
            <label for="ch-regex-before-after-editor">Surrounding regex (trim text before/after)</label>
            <textarea id="ch-regex-before-after-editor" class="st-chatu8-textarea" rows="3" placeholder="Enter a regular expression..."></textarea>
        </div>
        <div class="st-chatu8-field-col">
            <label for="ch-regex-text-editor">Text regex (content replacement)</label>
            <textarea id="ch-regex-text-editor" class="st-chatu8-textarea" rows="5" placeholder="Enter a regular expression..."></textarea>
        </div>
    </div>
    <div class="st-chatu8-settings-section">
        <h4>Regex preset editor</h4>
        <div class="st-chatu8-field">
            <div class="st-chatu8-profile-controls">
                <button class="st-chatu8-btn" id="ch-add-regex-entry-button" title="New regex entry">
                    <i class="fa-solid fa-plus"></i> New
                </button>
                <button class="st-chatu8-btn" id="ch-import-regex-entry-button" title="Import regex entries">
                    <i class="fa-solid fa-file-import"></i> Import
                </button>
                <button class="st-chatu8-btn" id="ch-import-regex-entry-engine-button" title="Import from ST Regex engine">
                    <i class="fa-solid fa-download"></i> Import from ST engine
                </button>
            </div>
        </div>
        <div id="ch-regex-entries-container" class="st-chatu8-preset-entries-container">
            <!-- 正则条目将在这里动态渲染 -->
        </div>
    </div>
    <div class="st-chatu8-settings-section">
        <h4>Simple word replacement</h4>
        <div class="st-chatu8-field">
            <label for="ch-word-replace-profile-select">Replacement configuration</label>
            <div class="st-chatu8-profile-controls">
                <select id="ch-word-replace-profile-select" class="st-chatu8-select"></select>
                <div class="st-chatu8-preset-box-wrapper">
                    <button type="button" class="st-chatu8-icon-btn st-chatu8-preset-box-btn" title="Preset action options">
                        <i class="fa-solid fa-cube"></i>
                    </button>
                    <div class="st-chatu8-preset-box-dropdown">
                        <div class="st-chatu8-preset-box-title">Replacement configuration options</div>
                        <div class="st-chatu8-preset-box-grid">
                            <button type="button" class="st-chatu8-preset-box-item" id="ch-new-word-replace-profile-button" title="New"><i class="fa-solid fa-plus"></i><span>New</span></button>
                            <button type="button" class="st-chatu8-preset-box-item" id="ch-rename-word-replace-profile-button" title="Rename"><i class="fa-solid fa-pen"></i><span>Rename</span></button>
                            <button type="button" class="st-chatu8-preset-box-item" id="ch-save-word-replace-profile-button" title="Save"><i class="fa-solid fa-save"></i><span>Save</span></button>
                            <button type="button" class="st-chatu8-preset-box-item" id="ch-import-word-replace-profile-button" title="Import"><i class="fa-solid fa-file-import"></i><span>Import</span></button>
                            <button type="button" class="st-chatu8-preset-box-item" id="ch-export-word-replace-profile-button" title="Export"><i class="fa-solid fa-file-export"></i><span>Export</span></button>
                            <button type="button" class="st-chatu8-preset-box-item danger" id="ch-delete-word-replace-profile-button" title="Delete"><i class="fa-solid fa-trash"></i><span>Delete</span></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="st-chatu8-field-col">
            <label for="ch-word-replace-text-editor">Main text replacements (display only)</label>
            <textarea id="ch-word-replace-text-editor" class="st-chatu8-textarea" rows="5" placeholder="One rule per line: term1=term2. Example: penis=🥒"></textarea>
        </div>
        <div class="st-chatu8-field-col">
            <label for="ch-word-replace-ai-editor">AI response replacements (before parsing)</label>
            <textarea id="ch-word-replace-ai-editor" class="st-chatu8-textarea" rows="3" placeholder="One rule per line: term1=term2. Example: safe_= removes safe_. Use \s for a space, e.g. _=\s."></textarea>
        </div>
    </div>
    <div class="st-chatu8-settings-section">
        <h4>Record gestures</h4>
        <div class="st-chatu8-field">
            <label for="ch-gesture-enabled">Enable gestures</label>
            <div class="st-chatu8-toggle">
                <input id="ch-gesture-enabled" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="ch-click-trigger-enabled">Toggle click trigger</label>
            <div class="st-chatu8-toggle">
                <input id="ch-click-trigger-enabled" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="ch-gesture-1-button">Gesture 1</label>
            <button class="st-chatu8-btn" id="ch-gesture-1-button">Record gesture 1</button>
        </div>
        <div class="st-chatu8-field">
            <label for="ch-gesture-2-button">Gesture 2</label>
            <button class="st-chatu8-btn" id="ch-gesture-2-button">Record gesture 2</button>
        </div>
        <div class="st-chatu8-field">
            <label for="ch-gesture-show-recognition">Recognition display</label>
            <div class="st-chatu8-toggle">
                <input id="ch-gesture-show-recognition" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="ch-gesture-show-trail">Handwriting preview</label>
            <div class="st-chatu8-toggle">
                <input id="ch-gesture-show-trail" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="ch-gesture-trail-color">Ink color</label>
            <input type="color" id="ch-gesture-trail-color" class="st-chatu8-input">
        </div>
        <div class="st-chatu8-field">
            <label for="ch-gesture-match-threshold">Match threshold</label>
            <input type="range" id="ch-gesture-match-threshold" class="st-chatu8-slider-input" min="0" max="100" step="1">
            <span id="ch-gesture-match-threshold-value" class="st-chatu8-slider-value"></span>
        </div>
    </div>
    <div class="st-chatu8-settings-section">
        <h4>Default user request preset</h4>
        <div class="st-chatu8-field">
            <label for="ch-demand-profile-select">Request preset</label>
            <div class="st-chatu8-profile-controls">
                <select id="ch-demand-profile-select" class="st-chatu8-select"></select>
                <button class="st-chatu8-icon-btn" id="ch-new-demand-profile-button" title="New preset"><i class="fa-solid fa-plus"></i></button>
                <button class="st-chatu8-icon-btn" id="ch-rename-demand-profile-button" title="Rename preset"><i class="fa-solid fa-pen"></i></button>
                <button class="st-chatu8-icon-btn" id="ch-save-demand-profile-button" title="Save preset"><i class="fa-solid fa-save"></i></button>
                <button class="st-chatu8-icon-btn danger" id="ch-delete-demand-profile-button" title="Delete preset"><i class="fa-solid fa-trash"></i></button>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="ch-image-gen-demand-enabled">Image request dialog</label>
            <div class="st-chatu8-toggle">
                <input id="ch-image-gen-demand-enabled" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="ch-visual-prep-demand-enabled">Video requirements dialog</label>
            <div class="st-chatu8-toggle">
                <input id="ch-visual-prep-demand-enabled" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field-col">
            <label for="ch-default-char-demand">Default character generation request</label>
            <textarea id="ch-default-char-demand" class="st-chatu8-textarea" rows="2" placeholder="Default when the user request is empty..."></textarea>
        </div>
        <div class="st-chatu8-field-col">
            <label for="ch-default-image-demand">Default image generation request</label>
            <textarea id="ch-default-image-demand" class="st-chatu8-textarea" rows="2" placeholder="Default when the user request is empty..."></textarea>
        </div>
        <div class="st-chatu8-field-col">
            <label for="ch-default-visual-prep-demand">Default video preparation request</label>
            <textarea id="ch-default-visual-prep-demand" class="st-chatu8-textarea" rows="2" placeholder="Default when the user request is empty..."></textarea>
        </div>
    </div>
    <div class="st-chatu8-settings-section">
        <h4>Test tools</h4>
        <div class="st-chatu8-field">
            <label for="ch-regex-test-mode">Test mode</label>
            <div class="st-chatu8-toggle">
                <input id="ch-regex-test-mode" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field-col">
            <label for="ch-regex-test-original-text">Original text</label>
            <textarea id="ch-regex-test-original-text" class="st-chatu8-textarea" rows="6"></textarea>
        </div>
        <div style="text-align: center; margin: 10px 0;">
            <button class="st-chatu8-btn" id="ch-test-regex-button">
                <i class="fa-solid fa-arrow-down"></i>
                Apply regex and test
                <i class="fa-solid fa-arrow-down"></i>
            </button>
        </div>
        <div class="st-chatu8-field-col">
            <label for="ch-regex-test-result-text">Text after regex</label>
            <textarea id="ch-regex-test-result-text" class="st-chatu8-textarea" rows="6" readonly></textarea>
        </div>
    </div>
</div>
