<div id="ch-tab-theme">
    <div class="st-chatu8-settings-section">
        <h3>Theme settings</h3>
        <div class="st-chatu8-field">
            <label for="theme_id">Theme presets</label>
            <div class="st-chatu8-profile-controls">
                <select id="theme_id" class="st-chatu8-select"></select>
                <div class="st-chatu8-preset-box-wrapper">
                    <button type="button" class="st-chatu8-icon-btn st-chatu8-preset-box-btn" title="Preset action options">
                        <i class="fa-solid fa-cube"></i>
                    </button>
                    <div class="st-chatu8-preset-box-dropdown">
                        <div class="st-chatu8-preset-box-title">Theme preset options</div>
                        <div class="st-chatu8-preset-box-grid">
                            <button type="button" class="st-chatu8-preset-box-item" id="theme_save_style" title="Save"><i class="fa-solid fa-save"></i><span>Save</span></button>
                            <button type="button" class="st-chatu8-preset-box-item" id="theme_export_current" title="Export current"><i class="fa-solid fa-upload"></i><span>Export current</span></button>
                            <button type="button" class="st-chatu8-preset-box-item" id="theme_export_all" title="Export all"><i class="fa-solid fa-file-export"></i><span>Export all</span></button>
                            <button type="button" class="st-chatu8-preset-box-item" id="theme_import" title="Import"><i class="fa-solid fa-download"></i><span>Import</span></button>
                            <button type="button" class="st-chatu8-preset-box-item danger" id="theme_delete_style" title="Delete"><i class="fa-solid fa-trash"></i><span>Delete</span></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="theme_generate_btn_style">Generation button style</label>
            <select id="theme_generate_btn_style" class="st-chatu8-select">
                <option value="默认">Default</option>
                <option value="渐变-蓝紫">Gradient: blue/purple</option>
                <option value="渐变-橙红">Gradient: orange/red</option>
                <option value="科技霓虹">Neon tech</option>
                <option value="极简黑白">Minimal monochrome</option>
                <option value="玻璃拟态">Glassmorphism</option>
                <option value="少女心">Sweet Pink</option>
                <option value="森林系">Forest theme</option>
                <option value="星空紫">Starry Purple</option>
                <option value="魔法图标">Magic icon</option>
                <option value="赛博几何">Cyber geometry</option>
                <option value="手绘风格">Hand-drawn style</option>
                <option value="极简文字">Minimal text</option>
                <option value="冰封水晶">Frozen Crystal</option>
                <option value="流光宝石">Glowing Gem</option>
                <option value="悬浮胶囊">Floating pill</option>
                <option value="全息立方">Holographic Cube</option>
                <option value="赛博方块">Cyber blocks</option>
                <option value="森林图标">Forest icon</option>
                <option value="少女图标">Girl icon</option>
                <option value="星空图标">Star icon</option>
                <option value="霓虹图标">Neon icon</option>
                <option value="宝石图标">Gem icon</option>
                <option value="原木质感">Wood Grain</option>
                <option value="云朵白">Cloud White</option>
                <option value="水流蓝">Water Blue</option>
            </select>
        </div>
        <div class="st-chatu8-field">
            <label for="theme_image_frame_style">Image frame style</label>
            <select id="theme_image_frame_style" class="st-chatu8-select">
                <option value="无样式">No style</option>
                <option value="简约白边">Simple white border</option>
                <option value="柔和阴影">Soft shadows</option>
                <option value="圆角相框">Rounded frame</option>
                <option value="复古画框">Vintage frame</option>
                <option value="科技边框">Tech border</option>
                <option value="霓虹光晕">Neon glow</option>
                <option value="玻璃质感">Glass texture</option>
                <option value="渐变边框">Gradient border</option>
                <option value="金色画框">Gold frame</option>
                <option value="极简线条">Minimal lines</option>
                <option value="浮雕效果">Embossed</option>
                <option value="漫画风格">Comic style</option>
                <option value="胶片边框">Film border</option>
            </select>
        </div>
        <div class="st-chatu8-field">
            <label for="theme_collapse_style">Collapsible frame style</label>
            <select id="theme_collapse_style" class="st-chatu8-select">
                <option value="默认">Default</option>
                <option value="极简线条">Minimal lines</option>
                <option value="科技霓虹">Neon tech</option>
                <option value="玻璃质感">Glass texture</option>
                <option value="暖色温馨">Warm and Cozy</option>
                <option value="森林绿意">Forest Green</option>
                <option value="少女粉彩">Pastel Pink</option>
                <option value="星空紫">Starry Purple</option>
            </select>
        </div>
        <div id="theme-color-pickers" class="st-chatu8-grid">
            <!-- Color pickers will be dynamically inserted here -->
        </div>
    </div>
</div>
